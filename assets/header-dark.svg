<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="niconiconainu - solo developer in Japan">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FEEEE"/>
      <stop offset="100%" stop-color="#1E90FE"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#10161F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1E90FE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1E90FE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2A3441"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="#0D1117"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)" opacity="0.55"/>
  <ellipse cx="1010" cy="140" rx="360" ry="260" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="18" fill="none" stroke="#232C38"/>

  <!-- left: identity -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <text x="66" y="84" font-size="15" letter-spacing="4.2" fill="#3FEEEE" opacity="0.95">MULVOLIN-ATELIER</text>
  </g>

  <text x="64" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="62" font-weight="800" letter-spacing="-1.4" fill="#E6EDF3">niconiconainu</text>

  <rect x="536" y="132" width="13" height="34" rx="2" fill="url(#accent)">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <rect x="66" y="184" width="132" height="5" rx="2.5" fill="url(#accent)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#9FB0C4">
    <text x="66" y="228">Solo developer in Japan, shipping mobile apps</text>
    <text x="66" y="260">with a fleet of AI agents &#8212; in public.</text>
  </g>

  <!-- right: Nico -->
  <rect x="866" y="26" width="248" height="248" rx="34" fill="url(#panel)" stroke="#242E3B"/>
  <g transform="translate(990,152) scale(1.18)">
    <!-- sticker outline -->
    <g fill="#F4F8FC" stroke="#F4F8FC" stroke-width="13" stroke-linejoin="round">
      <path d="M -34 -38 C -60 -44 -74 -16 -72 14 C -70 40 -54 54 -46 40 C -40 28 -35 -4 -34 -38 Z"/>
      <path d="M -34 -38 C -60 -44 -74 -16 -72 14 C -70 40 -54 54 -46 40 C -40 28 -35 -4 -34 -38 Z" transform="scale(-1,1)"/>
      <ellipse cx="0" cy="2" rx="60" ry="54"/>
    </g>
    <!-- floppy ears -->
    <path d="M -34 -38 C -60 -44 -74 -16 -72 14 C -70 40 -54 54 -46 40 C -40 28 -35 -4 -34 -38 Z" fill="#11161D"/>
    <path d="M -34 -38 C -60 -44 -74 -16 -72 14 C -70 40 -54 54 -46 40 C -40 28 -35 -4 -34 -38 Z" transform="scale(-1,1)" fill="#11161D"/>
    <!-- head -->
    <ellipse cx="0" cy="2" rx="60" ry="54" fill="#FFFFFF" stroke="#11161D" stroke-width="5"/>
    <!-- cheeks -->
    <circle cx="-38" cy="18" r="9.5" fill="#FFB3C7" opacity="0.9"/>
    <circle cx="38" cy="18" r="9.5" fill="#FFB3C7" opacity="0.9"/>
    <!-- eyes -->
    <circle cx="-21" cy="-6" r="7.5" fill="#11161D"/>
    <circle cx="21" cy="-6" r="7.5" fill="#11161D"/>
    <circle cx="-18.6" cy="-8.6" r="2.4" fill="#FFFFFF"/>
    <circle cx="23.4" cy="-8.6" r="2.4" fill="#FFFFFF"/>
    <!-- nose + smile -->
    <ellipse cx="0" cy="14" rx="7.5" ry="5.5" fill="#11161D"/>
    <path d="M -11 26 Q 0 35 11 26" fill="none" stroke="#11161D" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>

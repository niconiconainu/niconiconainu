name: Generate Snek

on:
  schedule:
    - cron: '30 21 * * *' # 毎日 06:30 JST
  workflow_dispatch:
  push:
    branches: [main]

# snek ブランチへの push が衝突するので同時に走らせない
concurrency:
  group: snek
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snek-dark.svg?palette=github-dark&color_snake=#1e90fe&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353
            dist/snek-light.svg?palette=github-light&color_snake=#12b8c8&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      # upload-artifact は外した。v3 は 2025-01 に停止しており、
      # 成果物は下の snek ブランチに出るので二重に保存する意味がない。
      - name: Deploy to snek branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snek
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
